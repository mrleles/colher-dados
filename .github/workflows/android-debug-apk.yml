name: Android debug APK

on:
  push:
    branches:
      - feat/android-dns-diagnostic
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL HTTPS pública da aplicação Colher Dados (sem barra final)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug -PapiBaseUrl="${{ inputs.api_base_url || 'https://colher-dados.vercel.app' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: colher-dados-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
